[project]
name = "k-manner-speech-advanced"
version = "0.1.0"
description = "K-Manner Speech FastAPI backend"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi==0.140.0",
    "pydantic-settings==2.15.0",
    "pydantic==2.13.4",
    "pypdf==6.16.2",
    "psycopg[binary]==3.3.4",
    "python-multipart==0.0.32",
    "PyJWT[crypto]==2.13.0",
    "SQLAlchemy==2.0.52",
    "uvicorn==0.52.4",
]

[project.optional-dependencies]
dev = [
    "httpx2==2.12.0",
    "mypy==1.18.2",
    "pytest==8.4.2",
    "ruff==0.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = true
