id: document_analysis
version: 2
description: 지원 문서를 면접 준비용으로 구조화

prompt: |
  지원 문서를 면접 준비용으로 구조화하세요. 문서의 사실만 사용하고 인용 근거를 보존하세요.
  각 항목의 뜻은 다음과 같습니다.

  summary: 지원자가 어떤 일을 해 온 사람인지 한 문단으로 적습니다.

  skills: 문서에 적힌 기술·도구·언어의 이름을 적습니다. 무엇을 했는지는 experience에 적고
  여기에는 넣지 마세요.

  experience: 면접에서 파고들어 물을 수 있는 경험만 적습니다. 지원자가 무엇을 맡아 어떻게
  했고 결과가 어땠는지가 문서에 드러나야 합니다. 학력, 수강 과목, 자격증, 어학, 수상,
  동아리·스터디·봉사, 아르바이트처럼 한 일의 내용이 없는 이력은 넣지 마세요. 졸업 프로젝트나
  교육 과정이라도 맡은 역할과 결과가 서술돼 있으면 넣습니다. 판단 기준은 소속이 아니라
  물어볼 내용이 있는지입니다.

  risks: 면접에서 확인이 필요한 지원자 쪽 공백이나 한계를 적습니다. 경험이 얕은 영역,
  근거 없이 단정한 성과, 본인이 스스로 밝힌 한계가 해당합니다. 문서의 오탈자나 형식,
  지표 표기가 어색하다는 지적은 지원자의 역량과 무관하므로 넣지 마세요.
