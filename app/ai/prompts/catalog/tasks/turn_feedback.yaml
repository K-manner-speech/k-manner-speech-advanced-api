id: turn_feedback
version: 4
description: 발화 한 턴에 대한 네 항목 채점

prompt: |
  한국어 발화를 네 항목으로 각각 5, 10, 15, 20, 25점 중 하나로 평가하세요.

  # 공통 행동 척도

  - 5점: 해당 역량이 관찰되지 않거나 발화가 대화 진행을 방해함.
  - 10점: 제한적으로 관찰되며 중요한 문제가 있음.
  - 15점: 일상 대화를 수행할 수 있는 기준 충족 수준. 강점으로 과장하지 않음.
  - 20점: 적절한 표현이 구체적으로 관찰되는 강점.
  - 25점: 관계와 맥락에 따라 표현을 능동적으로 조절한 뚜렷한 강점.

  # 평가 대상

  채점 대상은 target_utterance 한 문장뿐입니다. context 는 그 문장을 판단하기 위한 배경이며 채점 대상이 아닙니다. 이전 발화의 잘잘못이나 대화 전체의 완성도를 이 점수에 반영하지 마세요.

  # 채점 항목

  - honorifics — relationship 이 요구하는 종결어미, 호칭, 높임 수준을 지켰는지. 반말 관계에서 존댓말을 쓰지 않았다는 이유로 감점하지 마세요.
  - courtesy — 상대의 말에 반응하고 요청·거절·의견 차이를 부담스럽지 않게 전달했는지. 짧다는 이유만으로 무례하다고 판단하지 마세요.
  - context_fit — **previous_persona_message 에 대한 응답으로 적절한지.** 상대가 물은 것에 직접 답했는지, 대화 흐름을 이어갔는지로만 판단합니다. 시나리오 목표를 얼마나 진전시켰는지는 이 항목이 아닙니다.
  - naturalness — 실제 한국어 대화에서 이해하기 쉽고 자연스러운지. 의미를 방해하지 않는 말버릇, 사투리, 음성인식 띄어쓰기는 감점하지 마세요.

  # 강점과 개선 제안

  - 5점 또는 10점이면 strength 는 null이고 suggestion 을 반드시 작성하세요.
  - 15점은 기준 충족이지 강점이 아닙니다. strength 는 null로 두세요.
  - 20점 또는 25점이고 target_utterance 에 실제 긍정 행동이 있을 때만 strength 를 작성하세요.
  - 단순히 실수하지 않았다는 사실만으로 strength 를 만들지 마세요.

  # goal 의 위치

  goal 은 이 연습이 지향하는 목표입니다. **목표 달성 여부는 대화가 끝난 뒤 종합 평가가 판정하며, 개별 발화 채점의 몫이 아닙니다.**

  상대의 질문에 답하는 발화, 관계를 다지는 인사, 안내를 확인하는 되물음, 목표를 이룬 뒤의 마무리는 모두 대화의 정상적인 일부입니다. 목표 문장을 아직 말하지 않았다는 이유로 감점하지 마세요.

  # context 사용 방법

  - previous_persona_message 는 사용자가 방금 응답한 상대의 발화입니다.
  - preceding_messages 는 요약에 덮이지 않은 이전 대화 원문이고, earlier_summary 는 그보다 앞선 구간의 요약입니다. 둘로 대화가 어디까지 진행됐는지 파악하세요.
  - 대화를 여는 첫 발화라 참고할 맥락이 없으면 situation 으로 판단하세요.

  # 원칙

  target_utterance 에 실제로 드러난 내용만 근거로 삼으세요. 하지 않은 말을 했다고 가정하거나, 다음 턴에 할 법한 말을 미리 요구하지 마세요.
