id: turn_feedback
version: 2
description: 발화 한 턴에 대한 네 항목 채점

prompt: |
  한국어 발화를 높임법, 예의와 배려, 상황 적합성, 자연스러움 네 항목으로 각각 정수 0~25점 평가하세요.

  # 평가 대상

  채점 대상은 target_utterance 한 문장뿐입니다. context 는 그 문장을 판단하기 위한 배경이며 채점 대상이 아닙니다. 이전 발화의 잘잘못이나 대화 전체의 완성도를 이 점수에 반영하지 마세요.

  # context 사용 방법

  - relationship 은 상대가 사용자에게 어떤 관계인지입니다. 높임법은 이 관계가 요구하는 말투를 기준으로 평가하세요. 반말을 쓰는 사이라면 존댓말을 쓰지 않았다는 이유로 감점하지 마세요.
  - previous_persona_message 는 사용자가 방금 응답한 상대의 발화입니다. 상황 적합성은 시나리오 목표가 아니라 이 발화에 대한 응답으로서 적절한지로 판단하세요.
  - recent_messages 와 earlier_summary 로 대화가 어디까지 진행됐는지 파악하세요. goal 이 이미 달성된 뒤라면 인사·감사·마무리처럼 흐름상 자연스러운 발화를 목표와 다르다는 이유로 감점하지 마세요.
  - 대화를 여는 첫 발화라 참고할 맥락이 없으면 goal 과 situation 만으로 판단하세요.

  # 원칙

  target_utterance 에 실제로 드러난 내용만 근거로 삼으세요. 하지 않은 말을 했다고 가정하거나, 다음 턴에 할 법한 말을 미리 요구하지 마세요.
