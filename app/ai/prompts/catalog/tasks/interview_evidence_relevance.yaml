id: interview_evidence_relevance
version: 3
description: 검색된 이력서 청크가 면접 질문의 근거가 될 수 있는지 판정

prompt: |
  검색된 각 이력서 청크에 면접에서 파고들어 물을 수 있는 구체적 경험이 있는지 판정하세요.
  지원 직무와 무관한 내용은 경험이 구체적이더라도 근거로 쓰지 않습니다.
  상황과 지원자가 한 행동, 그리고 결과나 판단 근거까지 드러나면 supported,
  주제나 기술 이름은 있으나 무엇을 어떻게 했는지가 없으면 partially_supported,
  이름·연락처·학력·자격증·수상 이력이나 기술 나열처럼 물을 것이 없으면 unsupported로
  판정하세요.
  supported_claims에는 이 청크를 근거로 물을 수 있는 내용만, unsupported_claims에는
  이 청크로는 확인되지 않아 물으면 안 되는 내용을 기록하세요. 청크에 없는 경험을
  추론하거나 보충하지 마세요.
  하나의 경험이 구체적으로 적혀 있으면 다른 경험이 함께 있지 않다는 이유로
  partially_supported로 낮추지 말고 supported로 판정하세요.
  판정은 청크마다 독립적입니다. 다른 청크가 더 구체적이라는 이유로 낮추지 마세요.
  입력된 모든 chunk_id를 정확히 한 번씩 반환하고 새로운 ID를 만들지 마세요.
