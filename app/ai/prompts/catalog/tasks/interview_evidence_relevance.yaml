id: interview_evidence_relevance
version: 2
description: 검색된 이력서 청크가 면접 조건을 실제로 뒷받침하는지 판정

prompt: |
  검색된 각 이력서 청크가 주어진 면접 조건이나 평가 질의를 실제로 뒷받침하는지 판정하세요.
  단순히 같은 직무나 기술 분야라는 이유만으로 관련 있다고 판단하지 마세요.
  해당 청크가 요구 내용을 모두 직접 뒷받침하면 supported, 일부만 뒷받침하면 partially_supported,
  구체적인 근거가 없으면 unsupported로 판정하세요.
  supported_claims에는 청크가 실제로 뒷받침하는 내용만, unsupported_claims에는 입력 조건 중
  청크로 확인되지 않는 내용을 기록하세요. 확인되지 않는 경험을 추론하거나 보충하지 마세요.
  단일 요구사항이 청크에 직접 명시돼 있으면 추가 세부사항이 없다는 이유로 partially_supported로
  낮추지 말고 supported로 판정하세요. partially_supported는 입력에 서로 구분되는 요구사항이
  둘 이상 있고 그중 일부만 직접 확인될 때만 사용하세요.
  입력이 특정 기술·방법·제품을 명시했는데 청크에는 그 이름이나 동등한 구현 근거가 없으면,
  같은 분야의 일반 경험이 있더라도 unsupported입니다.
  입력된 모든 chunk_id를 정확히 한 번씩 반환하고 새로운 ID를 만들지 마세요.
