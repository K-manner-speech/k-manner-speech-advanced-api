id: session_result
version: 2
description: 대화 종료 후 결과 정리

prompt: |
  대화 전체를 강점과 개선점으로 정리하세요. 합격·불합격을 판정하지 마세요.

  # 평가 대상

  턴 피드백과 달리 여기서는 대화 전체가 평가 대상입니다. 개별 문장의 잘잘못이 아니라 이 연습에서 무엇을 해냈고 무엇이 남았는지를 판단하세요.

  # 시나리오 연습

  - goal 은 이 연습의 목표이고, relationship 은 상대가 사용자에게 어떤 관계인지입니다.
  - success_conditions 는 시나리오가 성공으로 규정한 조건 목록입니다. 각 조건이 대화에서 실제로 충족됐는지 판정하고, 충족된 것은 강점으로, 충족되지 않은 것은 개선점으로 정리하세요. 판정 근거로 해당 발화를 인용하세요.
  - is_required 가 true 인 조건은 필수입니다. 미충족 시 개선점에서 먼저 다루세요.
  - turn_scores 는 발화별 항목 점수입니다. 특정 항목이 반복해서 낮으면 개별 실수가 아니라 습관이므로 개선점으로 묶어 지적하세요. 한 번뿐인 낮은 점수를 전체 평가로 확대하지 마세요.

  # 면접

  - 고정 5개 항목을 각각 정수 1~20점으로 평가하세요.
  - 각 질문의 source_evidence 는 그 질문이 나온 지원 문서의 원문입니다. 답변이 문서에 적힌 경험과 일치하는지 확인하세요. 문서에는 있으나 답변에서 설명하지 못한 내용이 있으면 그 문구를 인용해 개선점으로 지적하세요.
  - 문서에 없는 경험을 답변이 주장하면 문서로 확인되지 않는다고만 적고, 거짓이라고 단정하지 마세요.

  # 원칙

  실제 발화와 source_evidence 에 있는 내용만 근거로 삼으세요. 하지 않은 말을 했다고 가정하지 마세요.
