id: session_result_free_chat
version: 1
description: 자유대화 종료 후 결과 정리

prompt: |
  자유대화 전체를 강점과 개선점으로 정리하세요. 합격·불합격이나 사용자의 성격을 판정하지 마세요.

  # 평가 대상

  개별 문장 하나가 아니라 대화 전체에서 실제로 관찰된 한국어 의사소통 행동이 평가 대상입니다.
  turn_scores 는 발화별 점수이며, 한 번의 낮은 점수를 습관으로 확대하지 말고 같은 문제가 여러 턴에서 반복될 때만 전체 개선점으로 정리하세요.

  # 공통 행동 척도

  네 항목은 각 25점이며 5, 10, 15, 20, 25의 의미를 다음처럼 해석하세요.

  - 5점: 해당 역량이 관찰되지 않거나 대화 진행을 방해함.
  - 10점: 제한적으로 관찰되며 중요한 문제가 반복됨.
  - 15점: 일상 대화를 수행할 수 있는 기준 충족 수준. 강점으로 과장하지 않음.
  - 20점: 적절한 표현이 구체적이고 일관되게 관찰되는 강점.
  - 25점: 관계와 맥락에 따라 표현을 능동적으로 조절하는 뚜렷한 강점.

  # 항목별 정의

  - honorifics(높임말): relationship 에 맞는 종결어미, 호칭, 높임 수준을 일관되게 사용했는지 평가합니다. 반말 관계에서 존댓말을 쓰지 않았다는 이유로 감점하지 마세요.
  - courtesy(예의와 배려): 상대의 말에 반응하고 요청·거절·의견 차이를 부담스럽지 않게 전달했는지 평가합니다. 짧은 답변이나 이모티콘 부재만으로 무례하다고 판단하지 마세요.
  - context_fit(상황 적합성): 상대의 질문과 직전 대화 흐름에 직접적이고 적절하게 응답했는지 평가합니다. 자유대화에는 달성해야 할 시나리오 목표가 없습니다.
  - naturalness(자연스러움): 문법적 완벽함이 아니라 실제 대화에서 이해하기 쉽고 자연스럽게 전달됐는지 평가합니다. 의미를 방해하지 않는 말버릇, 사투리, 음성인식 띄어쓰기는 감점하지 마세요.

  # 강점과 개선점

  - 평균적·기준 충족 수준을 강점으로 만들지 마세요. 20점 이상인 행동이 여러 발화에서 확인되거나 하나의 뚜렷한 긍정 행동으로 확인될 때만 strength 항목을 작성하세요.
  - 단순히 실수하지 않았다는 사실은 강점이 아닙니다.
  - improvement 는 부족했던 실제 발화, 보완 이유, 다음에 사용할 수 있는 구체적인 표현을 포함하세요.
  - evidence 는 판단에 사용한 실제 사용자 발화를 짧게 인용하세요.
  - 동일한 발화의 같은 측면을 강점과 개선점에 동시에 사용하지 마세요.

  # 원칙

  실제 사용자 발화와 제공된 대화 맥락만 근거로 삼으세요. 면접 역량, 이력서 근거, 시나리오 성공 조건을 평가하지 마세요.

