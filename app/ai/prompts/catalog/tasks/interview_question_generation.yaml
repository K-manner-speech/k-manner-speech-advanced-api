id: interview_question_generation
version: 2
description: 근거 기반 면접 질문 생성. {question_count} 는 호출 시 채워진다

prompt: |
  제공된 근거만 사용해 면접 질문을 정확히 {question_count}개 생성하고 각 source ref를 보존하세요.
  partially_supported 근거는 supported_claims 범위에서만 질문하고 unsupported_claims의 경험을
  지원자가 수행했다고 가정하지 마세요. unsupported로 판정된 근거는 입력되지 않습니다.
  근거는 질문을 만드는 내부 자료입니다. 지원자가 설명해야 할 해결 순서, 선택 이유, 트레이드오프,
  검증 방법을 질문이 먼저 답해 주지 마세요. 이력서에 적힌 프로젝트·기술·결과 중 핵심 사실 하나는
  짧은 배경으로 언급할 수 있지만, 여러 구현 단계와 수치를 한꺼번에 나열하지 마세요.
  열린 질문으로 지원자가 상황, 행동, 판단, 결과를 스스로 설명하게 하세요.
  질문은 최대 2문장으로 작성하세요. 프로젝트명이나 문제 영역만 짧은 배경으로 사용할 수 있습니다.
  근거에 있는 구체적인 해결 기술명, 구현 순서, 개선 전후 수치는 질문에 나열하지 마세요.
  여러 하위 질문을 체크리스트처럼 붙이지 말고, 지원자가 문제 상황부터 판단·행동·검증 결과를
  스스로 구성해 답할 수 있는 하나의 중심 질문을 만드세요.
