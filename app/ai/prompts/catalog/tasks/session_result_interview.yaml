id: session_result_interview
version: 1
description: 면접 종료 후 결과 정리

prompt: |
  면접 대화 전체를 강점과 개선점으로 정리하세요. 합격·불합격이나 지원자의 성격을 판정하지 마세요.

  # 평가 대상과 순서

  1. 질문별로 질문의 요구, 사용자 답변, 추가 질문의 보충 답변을 함께 검토하세요.
  2. 각 질문에서 아래 5개 역량이 어느 수준으로 관찰됐는지 판단하세요.
  3. 한 번의 인상으로 전체를 일반화하지 말고 질문별 관찰을 종합해 최종 점수를 정하세요.
  4. 각 항목은 반드시 한 번씩만 출력하세요.

  # 공통 행동 척도

  점수는 4, 8, 12, 16, 20 중 하나만 사용하세요.

  - 4점: 역량이 관찰되지 않음. 무응답, 질문과 무관한 답변, 설명 시도 없음.
  - 8점: 제한적으로 관찰됨. 일부 관련되지만 핵심·이유·과정·근거가 부족함.
  - 12점: 기준 충족. 질문에 직접 답하고 기본적인 이유나 과정을 설명함.
  - 16점: 강점. 구체적인 행동·근거·결과가 명확하고 일관되게 관찰됨.
  - 20점: 뚜렷한 강점. 복잡한 상황의 판단, 대안·트레이드오프, 검증과 회고까지 설명함.

  # 항목별 정의

  - question_understanding_fit(질문 이해·응답 적합성): 질문의 핵심 요구에 직접 답했고 요구 범위를 빠뜨리거나 다른 주제로 벗어나지 않았는지 평가하세요.
  - answer_structure(답변 구조·논리성): 결론, 상황·문제, 본인의 행동, 결과가 이해 가능한 순서와 논리로 연결되는지 평가하세요.
  - specificity_evidence(구체성·경험 근거): 추상적인 주장이나 기술명 나열을 넘어 본인의 행동, 도구, 수치, 검증 결과와 실제 경험을 제시했는지 평가하세요.
  - job_fit_problem_solving(직무 역량·문제 해결): 사람 자체의 직무 적합성을 단정하지 말고 원인 분석, 대안 비교, 선택 이유, 검증, 재발 방지 행동이 답변에서 관찰됐는지 평가하세요.
  - delivery_attitude(전달 명확성·응답 태도): 답변이 명확하고 간결한지, 추가 질문에 내용을 보완했는지, 모르는 경우에도 아는 범위와 확인 방법을 설명했는지 평가하세요. 억양, 사투리, 외향성이나 성격은 평가하지 마세요.

  # 강점과 보완점

  - 4점 또는 8점이면 strength 는 null이고 suggestion 은 반드시 작성하세요.
  - 12점은 기준 충족이지 강점이 아닙니다. strength 는 null로 두세요.
  - 16점 또는 20점이고 실제 사용자 발화에 적극적인 긍정 행동 근거가 있을 때만 strength 를 작성하세요.
  - 단순히 거짓말하지 않은 것, 실수하지 않은 것, "모르겠습니다"라고 말한 것만으로는 강점이 아닙니다.
  - 모르는 범위를 밝힌 뒤 현재 아는 내용, 접근 방법 또는 확인 계획을 설명했을 때만 제한적인 긍정 행동으로 볼 수 있습니다.
  - "없습니다"를 반복하거나 후속 설명을 시도하지 않은 행동은 보완 근거입니다.
  - evidence 는 판단에 사용한 실제 사용자 발화를 짧게 인용하세요.
  - 동일한 발화의 같은 측면을 강점과 보완점에 동시에 사용하지 마세요.

  # 지원 문서 근거

  - source_evidence 는 질문이 나온 지원 문서 원문입니다. 답변이 문서에 적힌 경험과 일치하는지 확인하고, 문서에는 있으나 답변에서 설명하지 못한 내용은 개선점으로 지적하세요.
  - source_evidence 는 사실 확인과 추가 설명의 근거이지 모범답안이 아닙니다. 문서 문장을 그대로 말하지 않았다는 이유만으로 감점하지 마세요.
  - 문서에 없는 경험을 주장하면 문서로 확인되지 않는다고만 적고 거짓이라고 단정하지 마세요.

  # 원칙

  실제 발화와 source_evidence 만 근거로 삼으세요. 일반 대화의 높임말·예의·상황 적합성·자연스러움 점수를 생성하지 마세요.

