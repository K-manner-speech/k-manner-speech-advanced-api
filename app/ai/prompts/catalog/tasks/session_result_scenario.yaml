id: session_result_scenario
version: 1
description: 시나리오 대화 종료 후 결과 정리

prompt: |
  시나리오 대화 전체를 강점과 개선점으로 정리하세요. 합격·불합격이나 사용자의 성격을 판정하지 마세요.

  # 평가 대상

  대화 전체의 한국어 의사소통 품질과 시나리오 성공 조건 충족 여부를 서로 구분해 평가하세요.
  turn_scores 는 발화별 점수입니다. 같은 문제가 여러 턴에서 반복될 때만 전체 습관으로 지적하고 한 번의 낮은 점수를 전체 평가로 확대하지 마세요.

  # 공통 행동 척도

  네 항목은 각 25점이며 5, 10, 15, 20, 25의 의미를 다음처럼 해석하세요.

  - 5점: 해당 역량이 관찰되지 않거나 대화 진행을 방해함.
  - 10점: 제한적으로 관찰되며 중요한 문제가 반복됨.
  - 15점: 시나리오 대화를 수행할 수 있는 기준 충족 수준. 강점으로 과장하지 않음.
  - 20점: 적절한 표현이 구체적이고 일관되게 관찰되는 강점.
  - 25점: 상대 반응과 관계에 따라 표현을 조절하며 대화를 자연스럽게 완수하는 뚜렷한 강점.

  # 항목별 정의

  - honorifics(높임말): relationship 에 맞는 종결어미, 호칭, 높임 수준을 일관되게 사용했는지 평가합니다. 반말 관계에서 존댓말을 쓰지 않았다는 이유로 감점하지 마세요.
  - courtesy(예의와 배려): 상대의 입장을 고려해 인사, 요청, 거절, 감사, 마무리를 적절하게 표현했는지 평가합니다. 성공 조건 하나의 누락을 모든 예의 행동의 실패로 확대하지 마세요.
  - context_fit(상황 적합성): 각 발화가 직전 상대 발화에 적절히 응답했고 대화 전체가 주어진 situation 안에서 진행됐는지 평가합니다. goal 달성 여부를 이 점수 하나에 전부 섞지 마세요.
  - naturalness(자연스러움): 실제 한국어 대화에서 이해하기 쉽고 자연스럽게 이어지는지 평가합니다. 의미를 방해하지 않는 말버릇, 사투리, 음성인식 띄어쓰기는 감점하지 마세요.

  # 목표와 성공 조건

  - goal 은 연습 목표이고 success_conditions 는 시나리오가 성공으로 정의한 조건입니다.
  - 각 성공 조건을 실제 발화 근거로 met(충족), partially_met(부분 충족), not_met(미충족) 중 하나로 판단하세요.
  - is_required 가 true 인 조건의 미충족은 개선점에서 우선 다루세요.
  - 조건 하나가 미충족됐다는 이유로 관련 없는 네 평가 항목을 일괄 감점하지 마세요.
  - 충족된 조건은 실제로 능동적인 긍정 행동이 확인될 때만 강점으로 작성하세요.

  # 강점과 개선점

  - 15점은 기준 충족이지 강점이 아닙니다. 20점 이상인 실제 긍정 행동만 strength 항목으로 작성하세요.
  - improvement 는 부족했던 실제 발화 또는 누락 행동, 보완 이유, 다음에 사용할 수 있는 구체적인 표현을 포함하세요.
  - evidence 는 판단에 사용한 실제 사용자 발화를 짧게 인용하세요.
  - 동일한 행동을 강점과 개선점에 동시에 사용하지 마세요.

  # 원칙

  실제 사용자 발화, relationship, goal, success_conditions 만 근거로 삼으세요.
